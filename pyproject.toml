[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wovn"
version = "0.1.0"
description = "Generate a documentation website from a GitHub repo via static analysis and BYOK Groq."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "httpx2>=2.0",
  "groq>=0.11",
  "openrouter>=1.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tiktoken>=0.8",
  "cryptography>=43",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "authlib>=1.4",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
wovn-analyze = "analysis.cli:main"
wovn-api = "api.main:run"

[tool.setuptools.packages.find]
where = [
  "apps",
  "services",
  "packages/skeleton-schema",
  "packages/doc-schema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps",
  "services",
  "packages/skeleton-schema",
  "packages/doc-schema",
]
filterwarnings = [
  # Starlette 1.6 TestClient still types against anyio.abc.BlockingPortal.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
